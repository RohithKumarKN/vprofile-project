name: Update Deployment (Charts Repo on same branch)

on:
  push:
    branches: ['**']

jobs:
  update-deployment:
    name: Update Deployment (Charts Repo on same branch)
    runs-on: ubuntu-latest
    # Run only on branch pushes (not PR events) so we don't mutate branches during PR validation
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    env:
      BRANCH_NAME: ${{ github.ref_name }}  # the source branch name (e.g., feature/x)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git
        run: sudo apt-get update && sudo apt-get install -y git

      - name: Debug variables
        run: |
          echo "CHARTS_REPO_URL=$CHARTS_REPO_URL"
          echo "IMAGE_NAME=$IMAGE_NAME"
          echo "GIT_SHA=$GITHUB_SHA"
          echo "BRANCH_NAME=$BRANCH_NAME"

      - name: Configure git
        run: |
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      - name: Verify branch exists in charts repo
        env:
          CHARTS_REPO_URL: ${{ env.CHARTS_REPO_URL }}
          CHARTS_REPO_TOKEN: ${{ env.CHARTS_REPO_TOKEN }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          # Check remote branch existence without cloning full repo
          set -e
          if git ls-remote --heads "https://oauth2:${CHARTS_REPO_TOKEN}@${CHARTS_REPO_URL}" "${BRANCH_NAME}" | grep -q "${BRANCH_NAME}"; then
            echo "Branch ${BRANCH_NAME} exists in charts repo."
          else
            echo "ERROR: Branch '${BRANCH_NAME}' does not exist in charts repo. Aborting to avoid creating a new branch."
            exit 1
          fi

      - name: Clone charts repo (this branch only)
        env:
          CHARTS_REPO_URL: ${{ env.CHARTS_REPO_URL }}
          CHARTS_REPO_TOKEN: ${{ env.CHARTS_REPO_TOKEN }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -e
          git clone --branch "${BRANCH_NAME}" --single-branch "https://oauth2:${CHARTS_REPO_TOKEN}@${CHARTS_REPO_URL}" charts-repo
          cd charts-repo
          git status
          git rev-parse --abbrev-ref HEAD

      - name: Update values.yaml
        working-directory: charts-repo
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TAG: ${{ github.sha }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -e
          # Update within the `app:` block only
          sed -i '/^app:/,/^[a-z]/ s|image:.*|image: '"${IMAGE_NAME}"'|' vprofile-charts/values.yaml
          sed -i '/^app:/,/^[a-z]/ s|tag:.*|tag: '"${TAG}"'|' vprofile-charts/values.yaml
          git add vprofile-charts/values.yaml
          git commit -m "Update image to ${TAG} on ${BRANCH_NAME}" || echo "No changes to commit"

      - name: Push changes to same branch
        working-directory: charts-repo
        env:
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -e
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$CURRENT_BRANCH" != "$BRANCH_NAME" ]; then
            echo "ERROR: Current branch ($CURRENT_BRANCH) != expected ($BRANCH_NAME). Aborting."
            exit 1
          fi
          git push origin "$BRANCH_NAME"