- name: Setup Tomcat & Deploy Artifact
  hosts: appsrvgrp
  become: yes
  vars:
    tomcat_home: /usr/local/tomcat8
    timestamp: "{{ ansible_date_time.date }}_{{ ansible_date_time.hour }}_{{ ansible_date_time.minute }}"

  tasks:
    - name: Download latest WAR from Nexus
      get_url:
        url: "http://{{ USER }}:{{ PASS }}@{{ nexusip }}:8081/repository/{{ reponame }}/{{ groupid }}/{{ artifactid }}/{{ build_version }}/{{ artifactid }}-{{ build_version }}.war"
        dest: "/tmp/{{ artifactid }}-{{ build_version }}.war"
      register: wardeploy
      tags:
        - deploy

    - name: Stop Tomcat service
      service:
        name: tomcat
        state: stopped
      tags:
        - deploy

    - name: Check if current ROOT exists
      stat:
        path: "{{ tomcat_home }}/webapps/ROOT"
      register: artifact_stat
      tags:
        - deploy

    - name: Backup current ROOT
      block:
        - name: Archive ROOT dir with timestamp
          archive:
            path: "{{ tomcat_home }}/webapps/ROOT"
            dest: "/opt/ROOT_{{ timestamp }}.tgz"
          when: artifact_stat.stat.exists
          register: archive_info

        - name: Delete current ROOT and ROOT.war
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ tomcat_home }}/webapps/ROOT"
            - "{{ tomcat_home }}/webapps/ROOT.war"
          when: archive_info is defined and archive_info.changed
      tags:
        - deploy

    - name: Deploy new artifact
      copy:
        src: "/tmp/{{ artifactid }}-{{ build_version }}.war"
        dest: "{{ tomcat_home }}/webapps/ROOT.war"
        remote_src: yes
        owner: tomcat
        group: tomcat
        mode: '0644'
      register: deploy_info
      tags:
        - deploy

    - name: Start Tomcat service
      service:
        name: tomcat
        state: started
      when: deploy_info.changed
      tags:
        - deploy

    - name: Wait until ROOT.war is extracted
      wait_for:
        path: "{{ tomcat_home }}/webapps/ROOT"
        timeout: 30
      tags:
        - deploy

    - name: Deploy web configuration file
      template:
        src: templates/application.j2
        dest: "{{ tomcat_home }}/webapps/ROOT/WEB-INF/classes/application.properties"
        force: yes
      notify:
        - Restart Tomcat
      tags:
        - deploy

  handlers:
    - name: Restart Tomcat
      service:
        name: tomcat
        state: restarted