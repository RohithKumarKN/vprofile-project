- name: Setup Tomcat10 & Deploy Artifact
  hosts: appsrvgrp
  become: yes
  vars:
    tomcat_home: /usr/local/tomcat10
    migration_tool: /usr/local/jakartaee-migration.jar
    timestamp: "{{ ansible_date_time.date }}_{{ ansible_date_time.hour }}_{{ ansible_date_time.minute }}"

  tasks:
    - name: Install Java 17 and Authbind
      apt:
        name:
          - openjdk-17-jdk
          - authbind
        state: present
        update_cache: yes

    - name: Download Tomcat 10
      get_url:
        url: "https://dlcdn.apache.org/tomcat/tomcat-10/v10.1.49/bin/apache-tomcat-10.1.49.tar.gz"
        dest: "/tmp/apache-tomcat-10.1.49.tar.gz"

    - name: Extract Tomcat 10
      unarchive:
        src: "/tmp/apache-tomcat-10.1.49.tar.gz"
        dest: "/usr/local/"
        remote_src: yes

    - name: Rename Tomcat directory
      command: mv /usr/local/apache-tomcat-10.1.49 {{ tomcat_home }}
      args:
        creates: "{{ tomcat_home }}"

    - name: Configure Tomcat port 80
      replace:
        path: "{{ tomcat_home }}/conf/server.xml"
        regexp: 'port="8080"'
        replace: 'port="80"'

    - name: Configure AUTHBIND for port 80
      file:
        path: /etc/authbind/byport/80
        state: touch
        owner: ubuntu
        mode: '0500'

    - name: Download Jakarta Migration Tool
      get_url:
        url: "https://archive.apache.org/dist/tomcat/jakartaee-migration/v1.0.9/binaries/jakartaee-migration-1.0.9-shaded.jar"
        dest: "{{ migration_tool }}"

    - name: Download latest WAR from Nexus
      get_url:
        url: "http://{{ USER }}:{{ PASS }}@{{ nexusip }}:8081/repository/{{ reponame }}/{{ groupid }}/{{ artifactid }}/{{ build_version }}/{{ artifactid }}-{{ build_version }}.war"
        dest: "/tmp/{{ artifactid }}-{{ build_version }}.war"

    - name: Migrate WAR for Jakarta EE
      command: >
        java -jar {{ migration_tool }}
        /tmp/{{ artifactid }}-{{ build_version }}.war
        {{ tomcat_home }}/webapps/ROOT.war

    - name: Restart Tomcat
      command: AUTHBIND=yes {{ tomcat_home }}/bin/catalina.sh restart